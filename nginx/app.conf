server {
    include mime.types;
    types {
      application/javascript js mjs;
    }
    listen       8081;
    server_name  localhost;

    location  {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Content-Type' 'text/plain';
        return 200 'Hello world.';
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /app;
    }
}
